<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset> 
        <legend>Thông tin cá nhân</legend>

    
    <form action ="/action_page.php" method="get" target="_blank">
     Họ và tên   <input list="nameList" name="name" placeholder="Nhập họ và tên" required>
        <datalist id="nameList">
            <option value="Nguyễn Văn A">
            <option value="Trần Thị B">
            <option value="Phạm Thị C">
        </datalist>
        <label type="number" for="age">Tuổi</label>
        <input type="number" id="age" name="age" placeholder="Nhập tuổi" required>
        <br> <br> <label for="phone">Số điện thoại</label>
        <input type="text" id="phone" name="phone" placeholder="Nhập số điện thoại" required  pattern="[0-9]{10}" title="Số điện thoại phải có 10 chữ số">

     <br> <br> <lable for="gmail">
        Gmail
     </lable>
     <input type="text" id="gmail" name="gmail" placeholder="Nhập Gmail" required>
     <br> <br><lable for="gender">
        Giới tính
     </lable>
     <select name="gender" id="gender" required>
        <option value="male">Nam</option>
        <option value="female" selected>Nữ</option>
        <option value="other">Khác</option>
        </select>
       <br><br> <label for="message">Miêu tả bản thân</label>
    
        <br> <textarea name="message" id="message" cols="30" rows="10" placeholder="Nhập nội dung" required ></textarea>

        <br><button type="button" onclick ="alert('Cảm ơn bạn đã gửi thông tin')">
            Gửi
        </button>


    </form>
    </fieldset>
</body>
</html>
